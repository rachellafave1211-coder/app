<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed square: iOS and Android apply their own corner rounding or mask. -->
  <rect width="512" height="512" fill="#d6457a"/>
  <g transform="translate(256 256) scale(var(--s, 1)) translate(-256 -256)">
    <circle cx="256" cy="256" r="150" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="34"/>
    <path d="M256 106 A150 150 0 1 1 106 256" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round"/>
    <!-- Dollar sign drawn as strokes so it doesn't depend on installed fonts. -->
    <path d="M296 214 C296 186 216 180 216 218 C216 256 298 250 298 292 C298 332 214 328 212 298" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 170 V346" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
